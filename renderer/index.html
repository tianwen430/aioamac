<!DOCTYPE html>

    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.8c0-.99.8-1.8 1.8-1.8h4.1l2 2.2h7.3c.99 0 1.8.81 1.8 1.8v8.2c0 .99-.81 1.8-1.8 1.8H5.3c-1 0-1.8-.81-1.8-1.8V6.8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>

    <symbol id="i-send" viewBox="0 0 24 24"><path d="m4 4 17 8-17 8 3.2-8L4 4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7.2 12H21" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></symbol>

    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.5" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="3.5" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4.2c0 .99-.81 1.8-1.8 1.8H5.8c-.99 0-1.8-.81-1.8-1.8V7.8C4 6.81 4.81 6 5.8 6H10" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 6.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3.8 19h16.4L12 4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 9v4.2M12 16.6v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.8C4 4.8 4.8 4 5.8 4H11v16H5.8c-1 0-1.8-.8-1.8-1.8V5.8ZM20 5.8c0-1-.8-1.8-1.8-1.8H13v16h5.2c1 0 1.8-.8 1.8-1.8V5.8Z" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8.2" cy="15.8" r="3.7" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m10.9 13.1 8.6-8.6M16.7 7.3l2.2 2.2M14.4 9.6l2.2 2.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>

    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>

    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.7 9l5.3 1.7-5.3 1.7L12 18l-1.7-5.6L5 10.7 10.3 9 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-text">
          <div class="brand-title">AIOA 工作台</div>
          <div class="brand-subtitle">本地 AI · 协同工作流</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="chat">
          <svg class="icon"><use href="#i-chat"></use></svg><span>对话</span>
        </button>
        <button class="nav-item" data-view="workflow">
          <svg class="icon"><use href="#i-flow"></use></svg><span>工作流</span>
          <span class="nav-dot hidden" id="workflowAlertDot"></span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg class="icon"><use href="#i-settings"></use></svg><span>设置</span>
        </button>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-section-head">
          <span>对话</span>
          <button class="icon-btn small" id="newChatBtn" title="新建对话">
            <svg class="icon"><use href="#i-plus"></use></svg>
          </button>
        </div>
        <div class="conversation-list" id="conversationList"></div>
      </div>

      <div class="sidebar-footer">
        <div class="local-line"><span class="status-dot"></span>本地桥接 · 直连模型</div>
        <div class="tiny">无账号 · 无服务器 · 不收费</div>
        <button class="sidebar-link" id="aboutLink">关于与数据位置</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar" id="topbar"></header>

      <section class="view" id="view-chat">
        <div class="chat-layout">
          <div class="chat-messages" id="chatMessages">
            <div class="chat-empty" id="chatEmpty">
              <div class="empty-orb"><svg class="icon"><use href="#i-spark"></use></svg></div>
              <h1>选择一个模型，开始工作</h1>
              <p>这是一个本地 Agent：可以对话，也可以在工作区里读取、搜索、创建和修改文件。<br>API Key 和你选择的模型只保存在本机。</p>
              <div class="empty-chips">
                <button class="suggest-chip" data-suggest="帮我看看当前工作区的目录结构，并说明这个项目是做什么的。">了解当前项目</button>
                <button class="suggest-chip" data-suggest="读取 README，整理一份简洁的项目说明。">总结 README</button>
                <button class="suggest-chip" data-suggest="在当前工作区创建一个简单的 index.html 页面，包含标题、说明和一个按钮。">创建一个页面</button>
              </div>
              <div class="empty-note"><svg class="icon"><use href="#i-folder"></use></svg> 文件工具只在你选择的工作区内生效</div>
            </div>
          </div>

          <div class="composer-wrap">
            <div class="composer" id="composer">
              <textarea id="chatInput" rows="1" placeholder="给 AI 发消息…（Enter 发送 · Shift+Enter 换行）"></textarea>
              <div class="composer-bar">
                <div class="composer-hint" id="composerHint">未选择工作区 · 文件工具不可用</div>
                <div class="composer-buttons">
                  <button class="btn ghost small hidden" id="stopBtn">
                    <svg class="icon"><use href="#i-stop"></use></svg> 停止
                  </button>
                  <button class="btn primary" id="sendBtn">
                    <svg class="icon"><use href="#i-send"></use></svg> 发送
                  </button>
                </div>
              </div>
            </div>
            <div class="composer-foot">AI 可能会出错。写入文件前可设置确认；重要文件请自行备份。</div>
          </div>
        </div>
      </section>

      <section class="view hidden" id="view-workflow">
        <div class="page-scroll" id="workflowContent"></div>
      </section>

      <section class="view hidden" id="view-settings">
        <div class="page-scroll" id="settingsContent"></div>
      </section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/workflow.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/init.js"></script>
</body>
</html>
