name: build-mac

# 在 GitHub 的 macOS 机器上打包，产物在 Actions 运行页面的 Artifacts 里下载。
# 使用前提：把「05_应用_v2」目录作为仓库根目录上传（package.json 在这一层）。
# 不要上传 release/、node_modules/ 或已经解包的 .app。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # GitHub 机器在海外，改用官方源，避免国内镜像拖慢或不通
      - name: Use official mirrors
        run: |
          printf 'electron_mirror=https://github.com/electron/electron/releases/download/\nelectron_builder_binaries_mirror=https://github.com/electron-userland/electron-builder-binaries/releases/download/\n' > .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build macOS dmg + zip (x64 + arm64)
        run: npm run build:mac

      - name: List artifacts
        run: ls -lh release/*.dmg release/*.zip

      - name: Write checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt

      # 分开上传：Apple Silicon 用户只下 arm64，Intel 用户只下 x64，
      # 避免一个 500MB 的大包让人误以为“单个安装包就这么大”。
      - name: Upload Apple Silicon (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: AIOA-Workbench-mac-arm64
          path: |
            release/*-mac-arm64.dmg
            release/*-mac-arm64.zip
            release/SHA256SUMS-mac.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Intel (x64)
        uses: actions/upload-artifact@v4
        with:
          name: AIOA-Workbench-mac-x64
          path: |
            release/*-mac-x64.dmg
            release/*-mac-x64.zip
            release/SHA256SUMS-mac.txt
          if-no-files-found: error
          retention-days: 14
